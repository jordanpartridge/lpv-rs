[package]
name = "lpv-rs"
version = "0.1.0"
edition = "2024"
description = "Unofficial Rust port of Raphael Stolt's lean-package-validator (lpv) 6.3.2: validates .gitattributes export-ignore rules"
license = "MIT"
repository = "https://github.com/jordanpartridge/lpv-rs"
readme = "README.md"
authors = ["Jordan Partridge <jordan@partridge.rocks>"]
publish = false

[dependencies]
clap = { version = "4.6.7", features = ["derive", "cargo"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tar = "0.4.46"
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3.27.0"
